# Alchemy — a slightly taller bar and airier panels; the palette already carries
# the mood, so the shell only needs room to breathe.

[bar]
background       = "#0D0A07"
background-alpha = 1.0
text             = "#D8D2C8"
# Modules calling attention to themselves (recording, voxtype, alerts, updates)
active           = "#C05A4A"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30
